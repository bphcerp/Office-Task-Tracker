name: office-task-tracker

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT}:5432"
    profiles: ["dev"]

  postgres-prod:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["prod"]

  backend:
    build:
      context: ./backend
      target: dev
      network: host
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT}:8000"
    profiles: ["dev"]

  backend-prod:
    build:
      context: ./backend
      target: prod
      network: host
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:8000"
    profiles: ["prod"]

  frontend:
    build:
      context: ./frontend
      target: dev
      network: host
    env_file:
      - .env
    environment:
      BACKEND_UPSTREAM: http://backend:8000
      PUBLIC_API_URL: /api
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:4321"
    profiles: ["dev"]

  frontend-prod:
    build:
      context: ./frontend
      target: prod
      args:
        PUBLIC_API_URL: /api
      network: host
    env_file:
      - .env
    depends_on:
      - backend-prod
    ports:
      - "${FRONTEND_PORT}:4321"
    profiles: ["prod"]

volumes:
  postgres-data:
